name: Release

on:
  workflow_call:
    inputs:
      typo3-extension-key:
        required: true
        type: string
    secrets:
      typo3-api-token:
        required: true

jobs:
  # Job: Create release
  release:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    outputs:
      release-notes-url: ${{ steps.create-release.outputs.url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Check if tag is valid
      - name: Check tag
        run: |
          if ! [[ ${{ github.ref }} =~ ^refs/tags/[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}$ ]]; then
            exit 1
          fi

  # Job: Publish on TER
  ter-publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [release]
    runs-on: ubuntu-latest
    env:
      TYPO3_EXTENSION_KEY: ${{ inputs.typo3-extension-key }}
      TYPO3_API_TOKEN: ${{ secrets.typo3-api-token }}
      TYPO3_EXCLUDE_FROM_PACKAGING: packaging_exclude.php
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Check if tag is valid
      - name: Check tag
        run: |
          if ! [[ ${{ github.ref }} =~ ^refs/tags/[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}$ ]]; then
            exit 1
          fi

      # Prepare version
      - id: get-version
        run: echo "version=${GITHUB_REF/refs\/tags\//}" >> $GITHUB_OUTPUT
      - id: get-comment
        run: echo "comment=See release notes at ${{ needs.release.outputs.release-notes-url }}" >> $GITHUB_OUTPUT

      # Prepare environment
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.5
          extensions: intl, mbstring, json, zip, curl
          tools: composer:v2, typo3/tailor:^2

      # tailor --version reports a hardcoded string, composer shows the installed release
      - name: Show tailor version
        run: |
          php ~/.composer/vendor/bin/tailor --version
          composer global show typo3/tailor | grep '^versions'

      - name: Reset files
        run: git reset --hard HEAD && git clean -dfx

      # set-version only patches the TER build, Packagist reads the tagged files as they are
      - name: Check version matches tag
        env:
          VERSION: ${{ steps.get-version.outputs.version }}
        run: |
          status=0
          if [ -f ext_emconf.php ]; then
            # shellcheck disable=SC2016
            emconf_version=$(php -r '$_EXTKEY = getenv("TYPO3_EXTENSION_KEY"); $EM_CONF = []; include "ext_emconf.php"; echo reset($EM_CONF)["version"] ?? "";')
            if [ "$emconf_version" != "$VERSION" ]; then
              echo "::error file=ext_emconf.php::Tag $VERSION does not match ext_emconf.php ($emconf_version). Bump the version before tagging."
              status=1
            fi
          fi
          composer_version=$(jq -r '.extra["typo3/cms"].version // empty' composer.json)
          if [ -n "$composer_version" ] && [ "$composer_version" != "$VERSION" ]; then
            echo "::error file=composer.json::Tag $VERSION does not match composer.json extra.typo3/cms.version ($composer_version). Bump the version before tagging."
            status=1
          fi
          exit "$status"

      # Release
      - name: Publish to TER
        run: |
          php ~/.composer/vendor/bin/tailor set-version "${{ steps.get-version.outputs.version }}"
          php ~/.composer/vendor/bin/tailor ter:publish --comment "${{ steps.get-comment.outputs.comment }}" "${{ steps.get-version.outputs.version }}"
